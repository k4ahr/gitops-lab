apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: nginx
        image: nginx:invalid
        env:
        - name: ENV
          value: "production"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
